[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "connor-nlp"
dynamic = ["version"]
description = "Keep an organized file system organized. Files new things where they belong, named your way."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Ycatsh" }]
keywords = ["files", "organizer", "sorting", "naming", "cli", "local", "embeddings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
dependencies = [
    "model2vec>=0.6",
    "numpy>=1.26",
    "platformdirs>=4.2",
    "pypdfium2>=4.30",
]

[project.urls]
Homepage = "https://github.com/ycatsh/connor"
Issues = "https://github.com/ycatsh/connor/issues"

[project.scripts]
connor = "connor.cli.main:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.hatch.version]
path = "src/connor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/connor"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF", "N", "PERF", "PTH", "ERA",
    "D209", "D301", "D401",
]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["model2vec.*", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"
