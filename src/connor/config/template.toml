# connor config

# Run `connor config` to check it.
# Paths are relative to [library] root. In globs, * is one folder and ** any depth.
# Hidden folders, repos, vaults and build dirs are always skipped.

[inbox]
dirs    = ["~"]
min_age = "2m"
ignore  = ["*.part", "*.crdownload", "*.tmp"]

[library]
root      = "~"
include   = []
exclude   = []
max_depth = 8

[sorting]
apply       = "high"    # high or med
new_folders = false
rename      = "scheme"  # off, scheme or junk
dupes       = "skip"    # skip or move

[names]
format      = "{date}_{title}"
date_format = "%Y-%m-%d"
date_from   = ["content", "modified"]
title_from  = "name"    # name or content
separator   = "_"
case        = "keep"    # keep, lower or title
max_length  = 80

# Naming schemes, one block each. A scheme can override any [names] key.
# Fields: {date} {title} {folder} {parent} {n} {n:02} {name}

# [[names.scheme]]
# name    = "course"
# folders = ["school/*/*/*"]
# format  = "{date}_{folder}_{title}"

# [[names.scheme]]
# name        = "invoices"
# folders     = ["finance/invoices"]
# format      = "{date}_{title}"
# date_format = "%Y-%m"

# [[names.scheme]]
# name    = "lessons"
# folders = ["work/*/lessons"]
# format  = "{n:02}_{title}"
# case    = "lower"

# Rules place files by name, before anything else.

# [[rules]]
# match = ["*.deb", "*.AppImage"]
# to    = "software/installers"

# Labels for `connor sort --by`, with words that describe them.
[categories]
# Invoices = "invoice bill amount due"

[watch]
schedule = "0 3 * * *"  # cron, or @daily, @weekly

[model]
name       = "minishlab/potion-base-8M"
read_chars = 2000
